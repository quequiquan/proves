<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Galàxia</title>
  <meta name="description" content="Agenda ràpida dels teus plans d'oci: sopars, concerts, trobades, sortides…">

  <!-- App instal·lable (iPhone i ordinador) -->
  <link rel="manifest" href="manifest.webmanifest" id="manifestLink">
  <meta name="theme-color" content="#221C18">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Galàxia">
  <link rel="apple-touch-icon" href="img/icona-180.png?v=2" id="iconaApple">
  <script>
    // Icona negra, gris perla o groc pàl·lid: l'iPhone l'agafa en afegir l'app a la pantalla d'inici
    (function () {
      try {
        var q = new URLSearchParams(location.search).get('icona');
        var tipus = ['fosca', 'perla', 'groc', 'nit', 'crua', 'blanc', 'posta', 'blau', 'vores'];
        if (tipus.indexOf(q) >= 0) localStorage.setItem('qqq-pref-icona', JSON.stringify(q));
        var t = JSON.parse(localStorage.getItem('qqq-pref-icona') || '"fosca"');
        if (t !== 'fosca' && tipus.indexOf(t) >= 0) {
          document.getElementById('iconaApple').href = 'img/icona-' + t + '-180.png?v=2';
          document.getElementById('manifestLink').href = 'manifest-' + t + '.webmanifest';
        }
      } catch (e) { /* res */ }
    })();
  </script>
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png?v=2">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Icones (Material Symbols): només les poques que es fan servir (afegir, festa, contactes, lloc) -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0&display=block&icon_names=add,celebration,contacts,location_on" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="img/icona.svg" alt="" class="logo">
      <div class="brand-nom"><b><span class="w-galaxia">Galàxia</span></b><span class="proves-tag" id="provesTag" hidden>PROVES</span></div>
    </div>
    <button class="cerca-btn" id="cercaBtn" aria-label="Cerca" title="Cerca un pla o un recordatori"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></button>
    <a class="ajuda-btn" id="ajudaBtn" href="guia.html" aria-label="Guia d'ús" title="Guia d'ús">?</a>
    <button class="sync-pill" id="syncBtn" hidden><svg viewBox="0 0 24 24"><path d="M7 18a5 5 0 0 1-.9-9.9A6 6 0 0 1 17.7 9 4.5 4.5 0 0 1 17 18z"/></svg><span></span></button>
    <nav class="tabs" id="tabs">
      <button data-view="inici"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="3.5" r="1.6"/><circle cx="19.4" cy="16.2" r="1.6"/><circle cx="4.6" cy="16.2" r="1.6"/></svg><span>Galàxia</span></button>
      <button data-view="propers"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg><span>Plans</span></button>
      <button data-view="calendari"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Calendari</span></button>
      <button data-view="gent"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21v-1a7 7 0 0 1 14 0v1M16 4a4 4 0 0 1 0 8M22 21v-1a7 7 0 0 0-4-6.3"/></svg><span>Contactes</span></button>
      <button data-view="ajustos"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>Ajustos</span></button>
    </nav>
    <button class="btn primary nou" id="btnNou" aria-label="Nou pla"><span class="plus">+</span><span class="txt">Nou pla</span></button>
  </header>

  <main id="main"></main>

  <dialog id="dlg"><form id="dlgForm" novalidate></form></dialog>
  <div id="toast" class="toast" hidden></div>
  <div id="impressio" aria-hidden="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script>
    // Les dades de l'app són al magatzem gran del mòbil (IndexedDB): l'iPhone només deixa uns 5 MB a localStorage.
    // Es llegeixen abans de carregar l'app; la primera vegada encara són a localStorage i l'app les hi passa.
    (function () {
      var KEY = 'qqq-dades-v1' + (/proves/i.test(location.pathname) ? '-proves' : '');
      var MARCA = KEY + '-idb';
      var fet = false;
      function arrenca() {
        if (fet) return; fet = true;
        var fitxers = ['config.js', 'calendari.js', 'frases.js', 'app.js', 'sync.js'];
        fitxers.forEach(function (src, i) {
          var el = document.createElement('script');
          el.src = src; el.async = false;
          if (i === fitxers.length - 1) el.onload = function () { dispatchEvent(new Event('galaxia-llesta')); };
          document.body.appendChild(el);
        });
      }
      function marcada() { try { return localStorage.getItem(MARCA) === '1'; } catch (e) { return false; } }
      // No s'ha pogut llegir: si les dades ja eren al magatzem gran, l'app no desa ni sincronitza (així no es perd res)
      function falla() { if (marcada()) window.__dadesBloquejades = true; arrenca(); }
      setTimeout(function () { if (!fet) falla(); }, 8000);
      try {
        var r = indexedDB.open('galaxia-dades', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
        r.onerror = falla; r.onblocked = falla;
        r.onsuccess = function () {
          if (fet) return;
          try {
            var db = r.result, g = db.transaction('kv').objectStore('kv').get(KEY);
            g.onerror = falla;
            g.onsuccess = function () {
              if (fet) return;
              window.__dadesDB = db;
              if (typeof g.result === 'string') window.__dadesIDB = g.result;
              else if (marcada()) {
                // L'iPhone ha buidat el magatzem: es comença de nou i tot torna del núvol (sense esborrar-hi res)
                try { localStorage.removeItem(MARCA); localStorage.removeItem(KEY + '-sync'); } catch (e) { /* res */ }
              }
              arrenca();
            };
          } catch (e) { falla(); }
        };
      } catch (e) { falla(); }
    })();
  </script>
</body>
</html>
